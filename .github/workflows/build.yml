name: Build and verify Windows
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Publish and verify
        shell: pwsh
        run: ./scripts/Publish-Windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: MouseStudio-win-x64
          path: |
            artifacts/*.zip
            artifacts/*.pdf
            artifacts/SHA256SUMS.txt
            artifacts/verification.json
